<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mindi</title>
<style>
:root{--bg:#0b3d2e;--bg2:#12624a;--fg:#f4f1e8;--card:#fffdf7;--red:#c62828;--blk:#1b1b1b;--gold:#f2c14e;--pan:rgba(0,0,0,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#072a20;--bg2:#0d4a38}}
:root[data-theme="dark"]{--bg:#072a20;--bg2:#0d4a38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at center,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#menu,#lobby{margin:auto;text-align:center;padding:20px;width:100%;max-width:340px}
.logo{width:96px;height:96px;margin:0 auto 12px;border-radius:24px;background:linear-gradient(145deg,#1f8a66,#0b3d2e);display:grid;place-items:center;color:var(--gold);font-size:60px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 3px rgba(242,193,78,.5)}
h1{margin:0 0 4px;font-size:38px;letter-spacing:4px;color:var(--gold)}
.sub{opacity:.8;margin-bottom:18px;font-size:14px}
button.b{display:block;width:100%;margin:8px 0;padding:13px;border:0;border-radius:14px;font-size:16px;font-weight:600;background:var(--gold);color:#2a1f00;cursor:pointer;transition:transform .15s}
button.b:active{transform:scale(.96)}
button.b.g{background:rgba(255,255,255,.14);color:var(--fg)}
input{width:100%;margin:5px 0;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:var(--fg);font-size:16px;text-align:center}
.box{margin-top:14px;padding:12px;background:var(--pan);border-radius:16px}
.row{display:flex;gap:8px}.row input{flex:1}.row button.b{width:90px;margin:5px 0}
#note{margin-top:12px;font-size:13px;min-height:18px;color:var(--gold)}
#code{font-size:52px;letter-spacing:10px;font-weight:800;color:var(--gold);margin:6px 0 14px}
#teams{display:grid;gap:8px;margin-bottom:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:13px}
.sc{background:var(--pan);padding:6px 10px;border-radius:10px;line-height:1.35}
.chip{background:var(--gold);color:#2a1f00;font-weight:700;padding:6px 12px;border-radius:20px;font-size:15px}
.chip.r{color:var(--red)}
#x{background:var(--pan);color:var(--fg);border:0;border-radius:10px;width:34px;height:34px;font-size:16px}
#table{flex:1;position:relative;min-height:0}
.seat{position:absolute;font-size:13px;background:var(--pan);padding:4px 10px;border-radius:12px;transition:box-shadow .2s}
.seat.act{box-shadow:0 0 0 2px var(--gold),0 0 14px var(--gold)}
.s1{left:6px;top:45%}.s2{left:50%;top:4px;transform:translateX(-50%)}.s3{right:6px;top:45%}
.slot{position:absolute;transform:translate(-50%,-50%)}
.p0{left:50%;top:68%}.p1{left:32%;top:45%}.p2{left:50%;top:26%}.p3{left:68%;top:45%}
#msg{text-align:center;min-height:22px;font-size:14px;padding:4px 12px}
#hand{display:flex;justify-content:center;padding:6px 8px 14px;min-height:calc(var(--cw)*1.5);--cw:clamp(40px,11.5vw,62px)}
.card{width:var(--cw,clamp(40px,11.5vw,62px));aspect-ratio:5/7;background:var(--card);border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:flex-start;padding:3px 5px;font-size:calc(var(--cw,50px)*.34);line-height:1;color:var(--blk)}
.card.r{color:var(--red)}
.card b{font-size:1.1em}.card i{font-style:normal;font-size:1.35em}
#hand .card{margin-left:calc(var(--cw)*-.45);transition:transform .15s}
#hand .card:first-child{margin-left:0}
#hand .card.ok{cursor:pointer;transform:translateY(-10px);box-shadow:0 0 0 2px var(--gold),0 4px 10px rgba(0,0,0,.5)}
#hand .card.no{filter:brightness(.6)}
.deal{animation:deal .4s ease-out backwards}
@keyframes deal{from{transform:translateY(-120px) rotate(-12deg);opacity:0}}
.pc{--cw:clamp(44px,12vw,64px);animation:fly .38s cubic-bezier(.2,.8,.3,1) backwards;transition:transform .45s,opacity .45s}
@keyframes fly{from{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(10deg);opacity:0}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:5}
.panel{background:#10241d;border:2px solid var(--gold);border-radius:20px;padding:22px;text-align:center;max-width:340px;width:100%;animation:deal .3s ease-out}
.panel h2{margin:0 0 10px;color:var(--gold)}
.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.suits button{font-size:30px;padding:10px 0;border:0;border-radius:12px;background:var(--card);cursor:pointer;color:var(--blk)}
.suits .r{color:var(--red)}
</style></head><body>
<div id="app">
 <div id="menu">
  <div class="logo">♠</div><h1>MINDI</h1><div class="sub">Mendicot · 4 players · 2 teams</div>
  <button class="b" id="bots">Play with Bots</button>
  <div class="box">
   <input id="nm" placeholder="Your name" maxlength="12" autocomplete="off">
   <input id="srv" placeholder="Server address" autocomplete="off" autocapitalize="off">
   <button class="b g" id="cr">Create room</button>
   <div class="row"><input id="cd" placeholder="CODE" maxlength="4" autocapitalize="characters" autocomplete="off"><button class="b g" id="jn">Join</button></div>
  </div>
  <div id="note"></div>
 </div>
 <div id="lobby" hidden>
  <div class="sub">Room code: share it with your friends</div>
  <div id="code"></div><div id="teams"></div>
  <button class="b" id="go">Start game (empty seats become bots)</button>
  <div id="wt" class="sub" hidden>Waiting for the host to start…</div>
  <button class="b g" onclick="toMenu()">Leave</button>
  <div class="sub" style="font-size:12px">Players 1 and 3 are partners, 2 and 4 are partners.</div>
 </div>
 <div id="game" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
  <header><div class="sc" id="sa"></div><div class="chip" id="tr">Trump ?</div><div class="sc" id="sb"></div><button id="x" onclick="toMenu()">✕</button></header>
  <div id="table">
   <div class="seat s1" id="n1"></div><div class="seat s2" id="n2"></div><div class="seat s3" id="n3"></div>
   <div class="slot p0"></div><div class="slot p1"></div><div class="slot p2"></div><div class="slot p3"></div>
  </div>
  <div id="msg"></div><div id="hand"></div>
 </div>
 <div id="ov" hidden></div>
</div>
<script src="engine.js"></script>
<script>
const $=id=>document.getElementById(id);
const SY=["♠","♥","♦","♣"],NM={11:"J",12:"Q",13:"K",14:"A"},nmv=v=>NM[v]||v,DIR=[[0,150],[-150,0],[0,-150],[150,0]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el=(c,x="")=>`<div class="card ${c.s%3==0?"":"r"} ${x}"><b>${nmv(c.v)}</b><i>${SY[c.s]}</i></div>`;
const srt=a=>a.slice().sort((a,b)=>a.s-b.s||b.v-a.v);
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let S=null,net=null,local=null,ovKey="",handKey="",prevLen=0,swept="";
const say=t=>$("msg").textContent=t, note=t=>$("note").textContent=t;
function show(id){for(const i of["menu","lobby","game"])$(i).hidden=i!=id}
function ov(key,html){if(ovKey==key)return;ovKey=key;const o=$("ov");o.hidden=false;o.innerHTML=`<div class="panel">${html}</div>`}
function noov(){ovKey="";$("ov").hidden=true}
function emit(m){if(local)local.act(0,m);else if(net&&net.readyState==1)net.send(JSON.stringify(m))}
function reset(){handKey="";prevLen=0;swept="";S=null;noov();document.querySelectorAll(".slot").forEach(s=>{s.innerHTML="";s.dataset.k=""})}
function toMenu(msg){if(local){local.destroy();local=null}if(net){const w=net;net=null;try{w.close()}catch(e){}}reset();show("menu");note(msg||"")}
function onMsg(m){if(m.t=="err"){note(m.m);if(net&&!S){const w=net;net=null;w.close()}return}if(m.t=="state"){S=m;render()}}
function normUrl(u){u=u.trim().replace(/\/+$/,"");if(/^wss?:\/\//.test(u))return u;u=u.replace(/^https?:\/\//,"");return(/^(localhost|127\.|192\.168\.|10\.)/.test(u)?"ws://":"wss://")+u}
function online(first){
 const name=$("nm").value.trim()||"Player",srv=$("srv").value.trim();
 if(!srv){note("Enter the server address first");return}
 st.set("mn",name);st.set("ms",srv);if(net)return;
 note("Connecting… the free server can take up to a minute to wake up");
 let ws;try{ws=new WebSocket(normUrl(srv))}catch(e){note("Bad server address");return}
 ws.onopen=()=>{net=ws;note("");ws.send(JSON.stringify(first(name)))};
 ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(x){}};
 ws.onclose=()=>{if(net===ws){toMenu("Disconnected from the server")}else if(!S)note("Could not connect")};
 ws.onerror=()=>{if(!S)note("Cannot reach the server")}}
$("cr").onclick=()=>online(n=>({t:"create",name:n}));
$("jn").onclick=()=>{const c=$("cd").value.trim().toUpperCase();if(c.length<4){note("Enter the 4-letter room code");return}online(n=>({t:"join",code:c,name:n}))};
$("go").onclick=()=>emit({t:"start"});
$("bots").onclick=()=>{reset();local=new Engine.Room((s,m)=>{if(s==0)onMsg(m)});local.code="BOTS";local.join("You");local.act(0,{t:"start"})};
$("nm").value=st.get("mn")||"";
$("srv").value=st.get("ms")||((location.protocol=="http:"||(location.protocol=="https:"&&location.hostname!="localhost"))?location.host:"");
function lobby(){
 const n=S.names,t=i=>n[i]?esc(n[i]):"waiting…";
 $("code").textContent=S.code;
 $("teams").innerHTML=`<div class="sc">Team A<br><b>${t(0)}</b> &amp; <b>${t(2)}</b></div><div class="sc">Team B<br><b>${t(1)}</b> &amp; <b>${t(3)}</b></div>`;
 $("go").hidden=S.seat!=S.host;$("wt").hidden=S.seat==S.host}
function drawHand(cards,ok,anim){
 const h=$("hand");h.innerHTML="";
 cards.forEach((c,i)=>{const t=document.createElement("div"),g=ok?(ok(c)?"ok":"no"):"";
  t.innerHTML=el(c,g+(anim?" deal":""));const e=t.firstChild;if(anim)e.style.animationDelay=i*35+"ms";
  if(ok&&ok(c))e.onclick=()=>emit({t:"play",c:{s:c.s,v:c.v}});h.appendChild(e)})}
function sweep(r){document.querySelectorAll(".slot .card").forEach(e=>{e.style.transform=`translate(${DIR[r][0]}px,${DIR[r][1]}px) scale(.5)`;e.style.opacity=0})}
function render(){
 const s=S;
 if(s.phase=="lobby"){noov();show("lobby");lobby();return}
 show("game");
 const me=s.seat,mt=me%2,rel=p=>(p-me+4)%4,nm=p=>p==me?"You":p==(me+2)%4?"Partner":s.names[p];
 $("sa").innerHTML=`<b>Us</b> (${s.tot[mt]})<br>Tens ${s.tens[mt]} · Tricks ${s.won[mt]}`;
 $("sb").innerHTML=`<b>Them</b> (${s.tot[1-mt]})<br>Tens ${s.tens[1-mt]} · Tricks ${s.won[1-mt]}`;
 const tc=$("tr");
 if(s.trump==null){tc.textContent="Trump ?";tc.classList.remove("r")}else{tc.textContent="Trump "+SY[s.trump];tc.classList.toggle("r",s.trump==1||s.trump==2)}
 for(let r=1;r<4;r++){const p=(me+r)%4,e=$("n"+r);e.textContent=nm(p)+" · "+s.counts[p];e.classList.toggle("act",s.turn===p)}
 const L=s.legal||[],has=c=>L.some(x=>x.s==c.s&&x.v==c.v),hc=srt(s.hand),mine=s.turn===me;
 const hk=hc.map(c=>c.s+"-"+c.v).join()+(mine?"T":"");
 if(hk!=handKey){handKey=hk;drawHand(hc,mine?has:null,hc.length>prevLen);prevLen=hc.length}
 const cur={};s.trick.forEach(x=>cur[rel(x.p)]=x.c);
 for(let r=0;r<4;r++){
  const sl=document.querySelector(".slot.p"+r),c=cur[r];
  if(!c){sl.innerHTML="";sl.dataset.k="";continue}
  const k=c.s+"-"+c.v;
  if(sl.dataset.k!=k){sl.dataset.k=k;sl.innerHTML=el(c,"pc");const e=sl.firstChild;e.style.setProperty("--dx",DIR[r][0]+"px");e.style.setProperty("--dy",DIR[r][1]+"px")}}
 if(s.win!=null&&s.trick.length==4){const k=s.rd+"/"+(s.won[0]+s.won[1]);if(swept!=k){swept=k;setTimeout(()=>sweep(rel(s.win)),850)}}
 let m="";
 if(s.phase=="trump")m=s.maker==me?"Choose the trump":nm(s.maker)+" is choosing trump…";
 else if(s.phase=="deal")m=`${nm(s.maker)} chose ${SY[s.trump]} as trump${s.how?" (13th card)":""}`;
 else if(s.phase=="play")m=s.win!=null?nm(s.win)+" wins the trick":mine?"Your turn":nm(s.turn)+" is thinking…";
 say(m);
 if(s.phase=="trump"&&s.maker==me){
  ov("t"+s.rd,`<h2>You make trump</h2><p>You can see only your first 5 cards. Pick a suit, or let your 13th card decide.</p><div class="suits">${SY.map((x,i)=>`<button class="${i%3?"r":""}" onclick="emit({t:'trump',v:${i}})">${x}</button>`).join("")}</div><button class="b g" onclick="emit({t:'trump',v:4})">Use my 13th card</button>`)
 }else if(s.phase=="over"){
  const w=s.res.wt==mt;
  ov("o"+s.rd,`<h2>${w?"Your team wins! 🎉":"The other team wins"}</h2><p>${s.res.txt}</p><p>Tens ${s.tens[mt]}–${s.tens[1-mt]} · Tricks ${s.won[mt]}–${s.won[1-mt]}</p>${me==s.host?`<button class="b" onclick="emit({t:'next'})">Next round</button>`:`<p>Waiting for the host…</p>`}`)
 }else noov()}
</script></body></html>
